<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover : 아이폰 노치와 홈 막대 자리까지 무대를 편다. 그 자리의
     단추는 styles.css 가 안전영역(env safe-area)만큼 비켜 세운다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 상태 표시줄 꼴은 default -- 화면을 시계 줄 아래부터 그린다. 앞 판 black-translucent 는 시계 줄 밑까지 그려, iOS 26 이 그 띠에
     얹는 흐림(리퀴드 글래스)에 톱니 단추가 걸려 번졌다 (사람이 짚었다. 노트앱은 default 라 흐림이 없었다). 이 값은 홈 화면에
     앱을 넣을 때만 읽혀, 바꾼 뒤에는 앱을 지웠다 다시 넣어야 닿는다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="버튜버">
<meta name="theme-color" content="#1c1c1e">
<title>LLM 버튜버</title>
<!--
  나가는 곳 제한 (CSP). Claude API 키가 폰 저장소에 남으므로, 앱 안에 끼어든 코드가
  그 키를 읽어도 밖으로 못 보내게 한다. 가는 곳은 이 앱 자신과 Claude 와 PC 창구 셋뿐이다.
  - connect-src : 'self' 와 api.anthropic.com 과 PC 창구(사설 망 안에서만 닿는 이 PC 의
    https :10000 -- Tailscale serve 가 127.0.0.1:8788 의 door.js 로 넘긴다). 창구는 두뇌
    Extra / Local 길이 쓴다. 이 출처는 사용자가 지시해 연 것이다 (두뇌 길 셋을 실제로 돌게 하는
    갈래를 고르며 "보안 설정을 그 주소로 열어도 된다"). 바꾸면 app.js 의 창구주소도 함께 고친다.
    blob: 은 넣은 VRM 을 임시 주소로 읽는 길이다.
  - img-src : blob: / data: 은 VRM 안의 그림(텍스처)이 그 꼴로 풀린다.
  - script-src : 파일만 허락하고 페이지 안에 적은 스크립트는 막는다. 하나 남은 안쪽
    글인 importmap 은 지문(sha256)으로만 허락한다 -- importmap 은 파일로 못 뺀다.
    importmap 을 한 글자라도 고치면(줄끝 바뀜 포함) 지문을 다시 셈해 여기를 고친다.
    안 고치면 three 를 못 찾아 아바타가 통째로 안 뜬다.
  - frame-ancestors 는 meta 로는 안 먹어 안 적는다.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-GeX7AxWEpaopuJWpJ8boAR++PJ5xnN/jil9zSenScdw='; connect-src 'self' https://api.anthropic.com https://desktop-nf165ol.taile108ad.ts.net:10000 https://llm-avatar-pc.yamak.ai blob: data:; img-src 'self' blob: data:; style-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<!-- 경로는 전부 상대 경로다. 앱 껍데기로 싸면 이 폴더 하나가 통째로 앱이 되어
     서버 뿌리('/')가 없다. -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<!-- booting : 앱 코드(app.js)가 화면 단추들을 다 정할 때까지 무대 위 단추와 줄을 숨긴다. 단추마다
     보이는 때가 갈리면(마이크는 코드가 받아쓰기를 물은 뒤에야 선다) 하나씩 따로 떠오른다
     (styles.css body.booting, app.js 다뜨기). -->
<body class="booting">
<main class="stage">
  <!-- 실시간 카메라 화면. 그리는 칸 뒤에 깔린다 -- 렌더러 캔버스는 비쳐 보여 아바타가 그 위에 선다.
       playsinline 이 없으면 아이폰이 화면 전체 재생으로 띄운다. -->
  <video id="camView" class="camView" playsinline muted hidden></video>
  <!-- 그리는 칸. 안의 캔버스는 렌더러가 만들고 아바타를 갈 때 통째로 갈아 끼운다. -->
  <div id="avatarHost" class="avatarHost"></div>

  <div id="emptyStage" class="emptyStage" hidden>
    <p>함께 이야기할 아바타를 넣어 주세요.</p>
    <button id="emptyAdd" type="button" class="primary">VRM 넣기</button>
  </div>

  <!-- 설정. PC 판의 톱니와 같은 그림이다 (평면 단색 / 톱니 여섯 / 가운데 구멍은
       evenodd). 화면에 늘 떠 있는 단추는 이것 하나다 -- 아바타 고르기와 모습은 설정의
       외형 항목이 다 들어서 PC 판의 가면 단추는 안 둔다. -->
  <button id="openSettings" type="button" class="topIcon gear" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M9.06 3.92 L9.86 1.01 L14.14 1.01 L14.94 3.92
        L16.30 4.55 L17.53 5.41 L20.45 4.65 L22.59 8.35 L20.47 10.51 L20.60 12.00
        L20.47 13.49 L22.59 15.65 L20.45 19.35 L17.53 18.59 L16.30 19.45
        L14.94 20.08 L14.14 22.99 L9.86 22.99 L9.06 20.08 L7.70 19.45 L6.47 18.59
        L3.55 19.35 L1.41 15.65 L3.53 13.49 L3.40 12.00 L3.53 10.51 L1.41 8.35
        L3.55 4.65 L6.47 5.41 L7.70 4.55 Z
        M15.9 12 A3.9 3.9 0 1 0 8.1 12 A3.9 3.9 0 1 0 15.9 12 Z"/>
    </svg>
  </button>
  <!-- 회전 방식 바꾸기. 톱니 바로 아래에 서고, 누를 때마다 더블탭 롱프레스 회전이 면 회전(화면 위에서
       돌림)과 축 회전(앞뒤 / 좌우로 비틂) 사이를 오간다 (app.js 회전 방식). 그림이 지금 방식을 보인다
       -- 면 회전은 돌아가는 화살표(Material rotate_right), 축 회전은 몸을 감아 도는 띠(Material 360). -->
  <button id="rotateMode" type="button" class="topIcon rotMode" data-mode="axis" aria-label="회전 방식 바꾸기">
    <svg class="plane" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.92 4 12s3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91s2.16-5.43 5-5.91V10l4.55-4.45zM19.93 11c-.17-1.39-.72-2.73-1.62-3.89l-1.42 1.42c.54.75.88 1.6 1.02 2.47h2.02zM13 17.9v2.02c1.39-.17 2.74-.71 3.9-1.61l-1.44-1.44c-.75.54-1.59.89-2.46 1.03zm3.89-2.42l1.42 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.02c-.14.87-.48 1.72-1.02 2.48z"/>
    </svg>
    <svg class="axis" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 7C6.48 7 2 9.24 2 12c0 2.24 2.94 4.13 7 4.77V20l4-4-4-4v2.73c-3.15-.56-5-1.9-5-2.73 0-1.06 3.04-3 8-3s8 1.94 8 3c0 .73-1.46 1.89-4 2.53v2.05c3.53-.77 6-2.53 6-4.58 0-2.76-4.48-5-10-5z"/>
    </svg>
  </button>
  <div id="notice" class="notice" role="status" hidden></div>
  <!-- 받아쓰기 파일을 받는 동안 마이크 줄 바로 위에 받은 % 를 띄운다 (app.js 키트받기). -->
  <div id="kitState" class="kitState" role="status" hidden></div>
  <!-- 최근 대화. 말 넣는 줄 바로 위에 말풍선으로 선다 (app.js 대화 줄). -->
  <div id="chatLog" class="chatLog" aria-live="polite"></div>
  <!-- 말 넣는 줄. form 으로 두어 자판의 보내기 키(Enter)로도 보낸다. -->
  <form id="chatBar" class="chatBar" autocomplete="off">
    <!-- 붙인 사진. 다음 말과 함께 두뇌에 간다. 누르면 뺀다. -->
    <button id="chatAttach" type="button" class="attach" aria-label="붙인 사진 빼기" hidden><img alt=""></button>
    <!-- 말 넣는 칸과 단추 셋을 한 상자에 담는다. 단추는 칸 안 왼쪽에 마이크 / 카메라 / 사진
         차례로 서고, 칸에 글을 치려고 손을 주면(.typing) 숨어 칠 자리를 상자 끝까지 내준다 (app.js
         칸 안 단추). 칸에는 안내 글을 안 둔다 -- 단추가 그 자리를 쓴다. 숨김 모드에서는 말 넣는 줄과
         함께 숨는다. 톱니와 같은 결의 평면 단색이고, 켠 동안 / 듣는 동안만 강조색. -->
    <div id="chatBox" class="inputBox">
      <div id="sideTools" class="fieldTools">
        <!-- 말로 걸기. 받아쓰기가 없는 판이거나 설정에서 껐으면 숨는다. -->
        <button id="chatMic" type="button" class="sideIcon" aria-label="말로 걸기" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.5a3.5 3.5 0 0 0-3.5 3.5v6a3.5 3.5 0 0 0 7 0V6A3.5 3.5 0 0 0 12 2.5z"/>
            <path d="M6 11.2a1 1 0 0 0-2 0 8 8 0 0 0 7 7.94V21H8.5a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2H13v-1.86a8 8 0 0 0 7-7.94 1 1 0 0 0-2 0 6 6 0 0 1-12 0z"/>
          </svg>
        </button>
        <!-- 실시간 카메라. 켜면 뒤 카메라가 아바타 뒤 배경에 깔리고, 말을 보낼 때 그 장면이 한 장
             함께 간다. -->
        <button id="chatCam" type="button" class="sideIcon" aria-label="카메라 켜고 끄기">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3h6l1.6 2H20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.4L9 3zm3 14a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0-2a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
        </button>
        <!-- 사진 보내기. 아이폰 고르기 창(사진 보관함 / 사진 찍기 / 파일)이 뜬다. -->
        <button id="chatPhoto" type="button" class="sideIcon" aria-label="사진 보내기">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5 4h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v8.6l4.3-4.3a1 1 0 0 1 1.4 0l3.3 3.3 2.3-2.3a1 1 0 0 1 1.4 0L20 15.6V7a1 1 0 0 0-1-1H5zm11.5 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          </svg>
        </button>
      </div>
      <input id="chatInput" type="text" enterkeyhint="send" aria-label="말 걸기">
    </div>
    <!-- 보내기. 노트앱 대화 칸의 보내기 단추와 같은 종이비행기 그림이다. -->
    <button id="chatSend" type="submit" class="sendBtn" aria-label="보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.1 19.2L22.9 12 6.1 4.8 6.1 10.4l12 1.6-12 1.6z"/></svg></button>
  </form>
</main>

<!-- 설정 판. 두 겹이다 -- 톱니를 누르면 항목 목록이 서고, 항목을 누르면 그 항목 화면으로
     들어간다 (app.js 설정 항목). 판을 오른쪽으로 휙 쓸면 항목 화면에서는 목록으로, 목록에서는
     판이 닫힌다 (app.js 판 쓸기, 노트앱 / 브릿지와 같은 손짓). 뒤로 단추는 안 둔다.
     한 판에 다 늘어놓으면 갈래가 늘수록 서로 섞여 찾을 자리가 없어진다. -->
<div id="settingsSheet" class="sheetBack" hidden>
  <section class="sheet" aria-label="설정">
    <header>
      <h2 id="setTitle">설정</h2>
      <button id="closeSettings" type="button" class="closeX" aria-label="닫기"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </header>

    <div id="setMenu" class="list">
      <button type="button" class="item nav" data-page="look">외형</button>
      <button type="button" class="item nav" data-page="voice">목소리</button>
      <button type="button" class="item nav" data-page="brain">두뇌/성격</button>
      <button type="button" class="item nav" data-page="res">해상도</button>
    </div>

    <!-- 외형. 아바타 하나를 다루는 것을 한 자리에 모은다 -- 고르고 넣기 / 손짓으로 맞춘 보기
         되돌리기 / 모습 값. -->
    <div class="page list" data-page="look" hidden>
      <h3 class="sub">아바타</h3>
      <ul id="avatarList" class="list"></ul>
      <button id="addAvatar" type="button" class="primary wide">VRM 넣기</button>
      <!-- 보기. 손짓으로 맞춘 자리 / 크기 / 몸 방향을 되돌린다. 셋을 따로 두는 것은 PC 판
           우클릭 메뉴와 같은 까닭이다 -- 자리만 어긋났는데 크기까지 풀리면 맞춘 것을 다시
           맞춰야 한다. -->
      <h3 class="sub">보기</h3>
      <button id="resetPlace" type="button" class="item">위치 되돌리기</button>
      <button id="resetSize" type="button" class="item">크기 되돌리기</button>
      <button id="resetTurn" type="button" class="item">몸 정면으로</button>
      <!-- 화면과 동작. PC 판 아바타 설정의 같은 값과 같은 범위다. 값은 아바타마다 따로 둔다.
           화면은 아바타가 어떻게 비치는가(자리 / 빛 / 팔 자세)이고 동작은 저절로 움직이는 것이다.
           흔들림은 세기 하나로 둔다 -- 0 이 곧 끔이라 켜고 끄는 자리를 따로 안 둔다. -->
      <h3 class="sub">화면</h3>
      <p id="lookState" class="state"></p>
      <label class="field slider"><span>거리 <output data-for="camZoom"></output></span>
        <input type="range" data-tune="camZoom" min="0.25" max="2.5" step="0.01">
      </label>
      <label class="field slider"><span>높이 <output data-for="camY"></output></span>
        <input type="range" data-tune="camY" min="-0.5" max="0.5" step="0.01">
      </label>
      <label class="field slider"><span>빛 세기 <output data-for="lightPower"></output></span>
        <input type="range" data-tune="lightPower" min="0" max="3" step="0.05">
      </label>
      <!-- 팔 높이. 저장 값은 PC 판과 같은 armDown(팔을 몸 옆으로 내린 각, 0~90도)이고, 이름이
           높이라 밀기를 거꾸로 세워(dir rtl) 오른쪽으로 밀면 팔이 올라가게 둔다. 옆 값도 높이로
           적는다 (90 - 내린 각, app.js 값적기). 모델은 팔을 옆으로 뻗고 서는 것이 기본이다. -->
      <label class="field slider"><span>팔 높이 <output data-for="armDown"></output></span>
        <input type="range" data-tune="armDown" min="0" max="90" step="1" dir="rtl">
      </label>
      <h3 class="sub">동작</h3>
      <label class="field slider"><span>숨쉬기 <output data-for="breath"></output></span>
        <input type="range" data-tune="breath" min="0" max="1" step="0.05">
      </label>
      <label class="field slider"><span>흔들림 <output data-for="idleSwayAmount"></output></span>
        <input type="range" data-tune="idleSwayAmount" min="0" max="2.5" step="0.05">
      </label>
      <label class="switch">눈 깜빡임 <input type="checkbox" data-tune="blink"></label>
      <!-- 켜면 몸 앞이 아니라 화면을 보는 사람(카메라)을 본다 (avatar-vrm.js 정면 응시). -->
      <label class="switch">정면 응시하기 <input type="checkbox" data-tune="lookCamera"></label>
      <button id="lookReset" type="button" class="item center">초기화</button>
    </div>

    <!-- 목소리. Supertonic 3 목소리(기본 10 + 섞음 5 + 사람이 넣은 결 파일)를 고른다 (shell.js 소리 판 목소리). 꾸러미를 받기
         전에는 폰 목소리(speechSynthesis)로 난다. 높낮이는 이 엔진에 없어 숨긴다 -- 폰 목소리로 날 때의 값은 저장된 것을 쓴다. -->
    <div class="page list" data-page="voice" hidden>
      <!-- PC 목소리. PC 창구(door)가 원본 목소리에 RVC 캐릭터 목소리를 씌워 보낸다 (shell.js PC 목소리). 창구에 목소리가 섰을 때만
           선다 (app.js PC목소리그리기). 높낮이는 반음 0 ~ 5 다 (사람이 견본 0 ~ 5 를 듣고 정했다). -->
      <label class="field" id="pcVoiceRow" hidden>PC 목소리
        <select id="pcVoicePick"></select>
      </label>
      <label class="field slider" id="pcVoiceTuneRow" hidden><span>높낮이 <output data-for="pcVoiceTune"></output></span>
        <input id="pcVoiceTune" type="range" min="0" max="5" step="1">
      </label>
      <label class="field">목소리
        <select id="voicePick"></select>
      </label>
      <label class="field slider"><span>빠르기 <output data-for="voiceRate"></output></span>
        <input id="voiceRate" type="range" min="0.5" max="2" step="0.05">
      </label>
      <label class="field slider" hidden><span>높낮이 <output data-for="voicePitch"></output></span>
        <input id="voicePitch" type="range" min="0.5" max="2" step="0.05">
      </label>
      <button id="voiceTry" type="button" class="item center">미리 듣기</button>
      <button id="voiceAdd" type="button" class="item center">내 목소리 파일 넣기</button>
      <button id="voiceDel" type="button" class="item center" hidden>이 목소리 지우기</button>
      <p class="note" id="voiceNote"></p>
    </div>

    <!-- 두뇌/성격. 키와 창구 열쇠는 이 폰에서만 풀리는 기기 열쇠로 잠가서만 이 폰에 남는다 (keybox.js, 비밀번호 없음).
         짜임과 꼴은 노트앱 LLM 설정을 따른다 -- 맨 위 줄이 길 셋(API / Extra / Local)을 고르고,
         그 아래 긴 단추가 모델을 고르는 자리이고, 누르면 그 아래에 앱 안 목록이 펴진다 (판이
         내주는 select 목록은 기기마다 생김새가 갈린다). API 는 Claude 에 곧바로 묻고, Extra 와
         Local 은 PC 창구(#!/door)를 거친다 -- 나가는 곳 제한(CSP)이 Claude 주소와 창구 주소
         둘만 연다. -->
    <div class="page list" data-page="brain" hidden>
      <div id="laneCaps" class="caps" role="group">
        <button type="button" data-lane="api">API</button>
        <button type="button" data-lane="extra">Extra</button>
        <button type="button" data-lane="local">Local</button>
      </div>
      <div class="field">모델
        <button id="modelPick" type="button" class="pickBtn" aria-expanded="false">
          <span id="modelLabel"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div id="modelList" class="pickList" hidden></div>
      </div>
      <!-- API 길의 칸. 키가 맞는지는 칸 안 오른쪽에 얹는다 (노트앱 열쇠 칸과 같은 꼴). 옆에
           세우면 표시가 제 자리를 차지해 칸이 판 끝에 못 닿는다. -->
      <div id="apiPane" class="lanePane">
        <p id="keyState" class="state"></p>
        <label class="field">Claude API 키
          <span class="keybox">
            <input id="brainKey" type="password" autocomplete="off" placeholder="sk-ant-">
            <span id="keyMark" class="mark"></span>
          </span>
        </label>
        <!-- 키를 만드는 곳. 주소를 누를 수 있게 세운다 (노트앱 열쇠 칸 아래 회사 주소와 같은 꼴) --
             글로만 적으면 키를 어디서 만드는지 알려 놓고도 주소를 손으로 옮겨 적게 한다. 곧바로 키
             화면으로 간다 (옛 console.anthropic.com 은 이 자리로 넘겨준다). 새 창으로 열어 앱을 안
             떠난다. -->
        <p class="note"><a id="keyLink" href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener noreferrer">platform.claude.com</a> 에서 만든 키를 넣어 주세요.</p>
      </div>
      <!-- Extra / Local 길의 칸. 둘 다 이 PC 의 창구를 지나서 열쇠가 하나다 (노트앱 창구 칸).
           맞는지는 창구에 물어 같은 자리에 얹는다. -->
      <div id="doorPane" class="lanePane" hidden>
        <label class="field">창구 열쇠
          <span class="keybox">
            <input id="doorKey" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="PC 쪽 설정에 적은 것과 같은 값">
            <span id="doorMark" class="mark"></span>
          </span>
        </label>
        <!-- 열쇠를 찾는 길. PC 바탕화면 바로가기가 창구 설정에서 열쇠를 읽어 QR 로 띄운다 (tools/key_show.py) -- 열쇠 사본 파일을
             안 남겨도 다시 넣을 수 있게 (사람이 골랐다). 열쇠 자체는 여기 안 적는다. -->
        <p class="note">PC 바탕화면의 'LLM 아바타 열쇠 보기'를 열면 열쇠가 QR 로 나와요. 아이폰 카메라로 비춰 복사한 뒤 여기에 붙여 넣어 주세요.</p>
      </div>
      <!-- PC 원본 쓰기. 켜면 앱 파일을 PC 창구에서 먼저 받아 PC 에서 고치는 판으로 뜬다 (app.js PC 원본 쓰기, sw.js PC원본).
           창구 열쇠가 잠겨 담겼을 때만 선다. -->
      <label class="switch" id="pcSrcRow" hidden>PC 원본 쓰기 <input type="checkbox" id="pcSrc"></label>
      <p class="note" id="pcSrcNote" hidden></p>
      <button id="keyForget" type="button" class="item center">초기화</button>
      <label class="field">성격
        <textarea id="brainPersona" rows="5"></textarea>
      </label>
      <button id="chatClear" type="button" class="item center">초기화</button>
    </div>

    <!-- 해상도. 아바타를 얼마나 또렷하게 / 몇 번 그릴지 (face/tune.js 해상도와 프레임, 설정 'render').
         해상도는 또렷함의 몫이다 -- 100% 면 화면 점 하나에 그림 점 하나(사람이 키운 배율까지 셈). 높일수록
         폰이 뜨거워지고 전지를 먹는다. 아바타마다가 아니라 이 폰 하나에 건다. -->
    <div class="page list" data-page="res" hidden>
      <label class="field slider"><span>해상도 <output data-for-render="res"></output></span>
        <input type="range" data-render="res" min="0.5" max="1" step="0.01">
      </label>
      <label class="field slider"><span>프레임 <output data-for-render="fps"></output></span>
        <input type="range" data-render="fps" min="30" max="120" step="30">
      </label>
    </div>
  </section>
</div>

<!--
  VRM 은 three 위에서 돈다. 그 부품들이 'three' 같은 짧은 이름으로 서로를
  부르는데 브라우저는 그 이름을 모르므로 여기서 실제 파일로 바꿔 준다.
  PC 판과 같은 이름 셋이고 주소만 상대 경로다.
  module 보다 먼저 와야 한다 -- 뒤에 두면 이미 읽기 시작한 것에는 안 걸린다.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "@pixiv/three-vrm": "./vendor/@pixiv/three-vrm/lib/three-vrm.module.js"
  }
}
</script>
<script src="./shell.js"></script>
<script src="./face/tune.js"></script>
<script type="module" src="./app.js"></script>
<script src="./sw-reg.js"></script>
</body>
</html>
